<section class="relative md:py-24 py-16 overflow-hidden">
  <div class="container md:mt-24 mt-16">
    <div class="grid grid-cols-1 pb-8 text-center">
      <h3 class="mb-4 md:text-[26px] md:leading-normal text-2xl leading-normal font-semibold">
        Here's why you'll love it Jobstack
      </h3>

      <p class="text-slate-400 max-w-xl mx-auto">
        Search all the open positions on the web. Get your own personalized salary estimate. Read
        reviews on over 30000+ companies worldwide.
      </p>
    </div>

    <div class="grid lg:grid-cols-4 md:grid-cols-3 sm:grid-cols-2 grid-cols-1 mt-8 gap-[30px]">
      @for (item of servicesData; track $index) {
        <div
          class="group p-6 shadow-sm shadow-gray-200 dark:shadow-gray-700 rounded-md bg-white hover:bg-primary/5 dark:bg-slate-900 dark:hover:bg-primary/10 text-center transition-all duration-500"
        >
          <div
            class="size-16 flex items-center justify-center mx-auto bg-primary/5 group-hover:bg-primary dark:bg-primary/10 dark:group-hover:bg-primary shadow-sm shadow-gray-200 dark:shadow-gray-700 rounded-lg transition-all duration-500"
          >
            <i class="text-[30px] text-primary group-hover:text-white" [ngClass]="item.icon"></i>
          </div>

          <div class="mt-4">
            <div
              (click)="$event.preventDefault()"
              class="text-lg font-semibold hover:text-primary transition-all duration-500"
            >
              {{ item.title }}
            </div>

            <p class="text-slate-400 mt-3 mb-2">{{ item.desc }}</p>

            <div
              (click)="$event.preventDefault()"
              class="hover:text-primary font-medium transition-all duration-500"
            >
              Read More <i class="uil uil-arrow-right"></i>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
