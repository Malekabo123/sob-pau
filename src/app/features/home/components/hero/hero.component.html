<section class="relative md:py-56 py-36 w-full">
  <div class="absolute inset-0 bg-primary/5 dark:bg-primary/10"></div>
  <div class="container z-1">
    <div class="grid grid-cols-1 text-center mt-10 relative">
      <h4 class="lg:leading-normal leading-normal text-4xl lg:text-5xl mb-5 font-bold">
        Join us & <span class="text-primary font-bold">Explore</span> <br />
        <span class="text-primary font-bold">Thousands</span> of Jobs
      </h4>
      <p class="text-slate-400 text-lg max-w-xl mx-auto">
        Find Jobs, Employment & Career Opportunities. Some of the companies we've helped recruit
        excellent applicants over the years.
      </p>

      <div class="d-flex" id="reserve-form">
        <div class="md:w-5/6 mx-auto">
          <div class="lg:col-span-10 mt-8">
            <div class="bg-white dark:bg-slate-900 border-0 shadow-sm rounded-md p-3">
              <form action="#">
                <div class="registration-form text-dark text-start">
                  <div class="grid lg:grid-cols-4 md:grid-cols-2 grid-cols-1 lg:gap-0 gap-6">
                    <div class="filter-search-form relative filter-border">
                      <i class="uil uil-briefcase-alt icons"></i>
                      <input
                        name="name"
                        type="text"
                        id="job-keyword"
                        class="form-input filter-input-box !bg-gray-50 dark:!bg-slate-800 border-0"
                        placeholder="Search your Keywords"
                      />
                    </div>

                    <div
                      class="filter-search-form relative filter-border bg-gray-50 h-[60px] dark:bg-slate-800 border-0 focus:ring-0"
                    >
                      <i class="uil uil-map-marker icons"></i>
                      <select
                        id="choices-location"
                        class="form-select ps-10 bg-gray-50 h-[60px] dark:bg-slate-800 border-0 focus:ring-0 w-full"
                        data-trigger
                        name="choices-location"
                        aria-label="Default select example"
                      >
                        <option value="AF">Afghanistan</option>
                        <option value="AZ">Azerbaijan</option>
                        <option value="BS">Bahamas</option>
                        <option value="BH">Bahrain</option>
                        <option value="CA">Canada</option>
                        <option value="CV">Cape Verde</option>
                        <option value="DK">Denmark</option>
                        <option value="DJ">Djibouti</option>
                        <option value="ER">Eritrea</option>
                        <option value="EE">Estonia</option>
                        <option value="GM">Gambia</option>
                      </select>
                    </div>

                    <div
                      class="filter-search-form relative filter-border bg-gray-50 h-[60px] dark:bg-slate-800 border-0 focus:ring-0"
                    >
                      <i class="uil uil-briefcase-alt icons"></i>
                      <select
                        class="form-select ps-10 bg-gray-50 h-[60px] dark:bg-slate-800 border-0 focus:ring-0 w-full"
                        data-trigger
                        name="choices-type"
                        id="choices-type"
                        aria-label="Default select example"
                      >
                        <option selected="" value="1">Full Time</option>
                        <option value="2">Part Time</option>
                        <option value="3">Freelancer</option>
                        <option value="4">Remote Work</option>
                        <option value="5">Office Work</option>
                      </select>
                    </div>

                    <input
                      type="submit"
                      id="search"
                      name="search"
                      style="height: 60px"
                      class="py-1 px-5 inline-block font-semibold tracking-wide border align-middle transition duration-500 ease-in-out text-base text-center bg-primary hover:bg-primary-700 border-primary hover:border-primary-700 text-white searchbtn submit-btn w-full"
                      value="Search"
                    />
                  </div>
                  <!--end grid-->
                </div>
                <!--end container-->
              </form>
            </div>
          </div>
          <!--ed col-->
        </div>
      </div>
      <!--end grid-->

      <div class="mt-4">
        <span class="text-slate-400"
          ><span class="text-slate-900 dark:text-white">Popular Searches :</span> Designer,
          Developer, Web, IOS, PHP Senior Engineer</span
        >
      </div>

      <div class="absolute -top-20 start-1/2 -translate-x-1/2">
        <div
          class="size-10 animate-[bounce_2s_infinite] bg-white dark:bg-slate-900 flex items-center justify-center shadow-sm shadow-gray-200 dark:shadow-gray-700 rounded-md"
        >
          <img src="assets/images/company/facebook-logo.png" class="size-6" alt="" />
        </div>
      </div>

      <div class="absolute top-[20%] start-10">
        <div
          class="size-10 animate-[spin_5s_linear_infinite] bg-white dark:bg-slate-900 flex items-center justify-center shadow-sm shadow-gray-200 dark:shadow-gray-700 rounded-md"
        >
          <img src="assets/images/company/google-logo.png" class="size-6" alt="" />
        </div>
      </div>

      <div class="absolute top-[20%] end-1">
        <div
          class="size-10 bg-white dark:bg-slate-900 flex items-center justify-center shadow-sm shadow-gray-200 dark:shadow-gray-700 rounded-md"
        >
          <img src="assets/images/company/android.png" class="size-6" alt="" />
        </div>
      </div>

      <div class="absolute top-3/4 start-1">
        <div
          class="size-10 bg-white dark:bg-slate-900 flex items-center justify-center shadow-sm shadow-gray-200 dark:shadow-gray-700 rounded-md"
        >
          <img src="assets/images/company/lenovo-logo.png" class="size-6" alt="" />
        </div>
      </div>

      <div class="absolute top-3/4 end-10">
        <div
          class="size-10 animate-[spin_5s_linear_infinite] bg-white dark:bg-slate-900 flex items-center justify-center shadow-sm shadow-gray-200 dark:shadow-gray-700 rounded-md"
        >
          <img src="assets/images/company/skype.png" class="size-6" alt="" />
        </div>
      </div>

      <div class="absolute -bottom-32 start-1/2 -translate-x-1/2">
        <div
          class="size-10 animate-pulse bg-white dark:bg-slate-900 flex items-center justify-center shadow-sm shadow-gray-200 dark:shadow-gray-700 rounded-md"
        >
          <img src="assets/images/company/snapchat.png" class="size-6" alt="" />
        </div>
      </div>
    </div>
    <!--end grid-->
  </div>
  <!--end container-->
</section>
