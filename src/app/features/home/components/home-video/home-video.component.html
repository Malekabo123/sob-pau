<section
  class="py-20 w-full table relative bg-[url('../../assets/images/hero/bg2.jpg')] bg-top bg-no-repeat bg-cover"
>
  <div class="absolute inset-0 bg-slate-900/70"></div>
  <div class="container relative">
    <div class="grid grid-cols-1 text-center">
      <h3 class="mb-4 md:text-[26px] text-2xl text-white font-medium">
        Get the job that's right for you
      </h3>

      <p class="text-white/80 max-w-xl mx-auto">
        Search all the open positions on the web. Get your own personalized salary estimate. Read
        reviews on over 30000+ companies worldwide.
      </p>

      <div
        (click)="togggleModal($event)"
        class="lightbox size-20 rounded-full shadow-lg dark:shadow-gray-800 inline-flex items-center justify-center bg-white dark:bg-slate-900 text-primary mx-auto mt-10"
      >
        <i class="mdi mdi-play inline-flex items-center justify-center text-2xl"></i>
      </div>
    </div>
    <!--end grid-->
  </div>
  <!--end container-->
</section>
<div
  class="flex bg-slate-900/70 overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full"
  *ngIf="isOpen"
>
  <div class="relative p-1 w-full max-w-2xl max-h-full">
    <div class="relative bg-white rounded-lg shadow-xs dark:bg-gray-700">
      <div
        class="flex items-center justify-between p-1 border-b rounded-t dark:border-gray-600 border-gray-200"
      >
        <button
          type="button"
          (click)="togggleModal($event)"
          class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white"
          data-modal-hide="default-modal"
        >
          <svg
            class="w-3 h-3"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 14 14"
          >
            <path
              stroke="currentColor"
              strokeLinecap="round"
              strokeLinejoin="round"
              strokeWidth="2"
              d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
            />
          </svg>
          <span class="sr-only">Close modal</span>
        </button>
      </div>
      <div class="p-1 md:p-1 space-y-4">
        <iframe
          width="100%"
          height="400"
          src="https://www.youtube.com/embed/yba7hPeTSjk?playlist=yba7hPeTSjk&loop=1"
        ></iframe>
      </div>
    </div>
  </div>
</div>
